name: 热点雷达

# 双层保障，不依赖任何外部服务：
#   1) schedule 触发 → 循环跑 5.5 小时，内部每 15 分钟抓取并自部署
#   2) 循环结束前用 GITHUB_TOKEN 触发下一次（GitHub 官方允许 workflow_dispatch
#      成为 GITHUB_TOKEN 递归限制的例外），形成接力链；有排队任务时不接力，避免堆积
on:
  schedule:
    - cron: "7,27,47 * * * *"
  push:
    branches: [main]
    paths-ignore: ["data/**"]
  workflow_dispatch:
    inputs:
      test_push:
        description: "强制推一次飞书"
        type: boolean
        default: false
      loop_minutes:
        description: "循环时长（分钟，0=只跑一轮）"
        default: "0"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: hotspot-radar
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取 + 循环部署
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEST_PUSH: ${{ inputs.test_push }}
        run: |
          set +e
          if [ "${{ github.event_name }}" = "schedule" ]; then
            MINUTES=330
          else
            MINUTES="${{ inputs.loop_minutes }}"
            [ -z "$MINUTES" ] && MINUTES=0
          fi
          END=$(( $(date +%s) + MINUTES * 60 ))
          ROUND=0

          deploy() {
            cd out
            rm -rf .git
            git init -q
            git checkout -q -b gh-pages
            git add -A
            git -c user.name=bot -c user.email=bot@users.noreply.github.com \
                commit -q -m "update $(date -u +%FT%T)" || true
            git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
            cd ..
            rm -rf out/.git
          }

          while :; do
            ROUND=$((ROUND+1))
            echo "===== 第 $ROUND 轮 $(date '+%m-%d %H:%M') ====="
            if [ "$TEST_PUSH" = "true" ]; then
              python radar.py sync --test-push
              TEST_PUSH=false
            else
              python radar.py sync
            fi
            deploy || echo "!! 部署失败，下一轮重试"
            [ "$(date +%s)" -ge "$END" ] && break
            sleep 900
          done
          echo "循环结束，共 $ROUND 轮"

      - name: 接力（触发下一段，避免空档）
        if: success()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          # 已有排队任务（例如 schedule 触发的）就不再接力，否则队列会越来越长
          QUEUED=$(curl -sS -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?status=queued&per_page=100" \
            | python3 -c "import sys,json;print(len(json.load(sys.stdin).get('workflow_runs',[])))" 2>/dev/null)
          echo "队列中任务数: ${QUEUED:-?}"

          if [ "${QUEUED:-0}" -eq 0 ]; then
            echo "→ 接力，触发下一段 5.5 小时"
            curl -sS -X POST \
              -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/radar.yml/dispatches" \
              -d '{"ref":"main","inputs":{"loop_minutes":"330","test_push":"false"}}' \
              -w "HTTP %{http_code}\n"
          else
            echo "已有任务在排队，本次不接力"
          fi

      - name: 存回数据库
        if: always()
        run: |
          git config user.name  "hotspot-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f data/hotspot.db
          git diff --staged --quiet || git commit -m "chore: 更新热榜库 $(date -u +'%m-%d %H:%M')"
          git pull --rebase -q origin main || true
          git push || true
