name: 热点雷达

# 热点时效性强，15 分钟一轮（GitHub 定时有 5–20 分钟延迟，属正常）
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  push:
    branches: [main]
    paths-ignore: ["data/**"]
  workflow_dispatch:
    inputs:
      test_push:
        description: "强制推一次（不管有没有新上榜）"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: hotspot-radar
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取 + 聚类 + 生成热榜
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
        run: |
          if [ "${{ inputs.test_push }}" = "true" ]; then
            python radar.py sync --test-push
          else
            python radar.py sync
          fi

      - name: 存回数据库（first_seen 靠它判断新上榜）
        run: |
          git config user.name  "hotspot-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f data/hotspot.db
          git diff --staged --quiet || git commit -m "chore: 更新热榜 $(date -u +'%m-%d %H:%M')"
          git push || true

      - name: 部署到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          keep_files: false
          exclude_assets: "*.png"
